name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PLUGINVAL_VERSION: v1.0.4

# Pull requests are checked on Windows and Linux only: GitHub's macOS
# runners queue for a long time and often get cancelled. The macOS build
# (and Apple's AU validator) runs in release.yml for every release.
jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one OS failing shouldn't hide results from the others
      matrix:
        include:
          - name: Windows
            os: windows-latest
            pluginval: pluginval_Windows.zip
            pluginval_exe: ./pluginval.exe
          - name: Linux
            os: ubuntu-latest
            pluginval: pluginval_Linux.zip
            pluginval_exe: xvfb-run -a ./pluginval
            pluginval_flags: --skip-gui-tests # no display on the Linux runner
            # Two compile/link jobs at a time: four at once can run the
            # runner out of memory while linking JUCE with LTO, and GitHub
            # then stops it with a "shutdown signal".
            build_jobs: 2

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libxi-dev xvfb

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.build_jobs }}

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # pluginval loads the plugin the way a DAW does and stress-tests it:
      # threading, state save/restore, parameter edge cases, bus layouts.
      - name: Validate VST3 with pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval }}"
          unzip -q pluginval.zip
          ${{ matrix.pluginval_exe }} --strictness-level 10 --validate-in-process ${{ matrix.pluginval_flags }} \
            --validate "build/plugin/Genisys_artefacts/Release/VST3/Genisys.vst3"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Genisys-${{ matrix.name }}
          path: |
            build/plugin/Genisys_artefacts/Release/VST3
            build/plugin/Genisys_artefacts/Release/Standalone
          if-no-files-found: error
