name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one OS failing shouldn't hide results from the others
      matrix:
        include:
          - name: Windows
            os: windows-latest
            pluginval: pluginval_Windows.zip
            pluginval_exe: ./pluginval.exe
          - name: macOS
            os: macos-latest
            pluginval: pluginval_macOS.zip
            pluginval_exe: ./pluginval.app/Contents/MacOS/pluginval
            # One "universal" binary that runs on both Apple Silicon and Intel Macs.
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          - name: Linux
            os: ubuntu-latest
            pluginval: pluginval_Linux.zip
            pluginval_exe: xvfb-run -a ./pluginval
            pluginval_flags: --skip-gui-tests # no display on the Linux runner

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libxi-dev xvfb

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # pluginval loads the plugin the way a DAW does and stress-tests it:
      # threading, state save/restore, parameter edge cases, bus layouts.
      - name: Validate VST3 with pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval }}"
          unzip -q pluginval.zip
          ${{ matrix.pluginval_exe }} --strictness-level 10 --validate-in-process ${{ matrix.pluginval_flags }} \
            --validate "build/plugin/Genisys_artefacts/Release/VST3/Genisys.vst3"

      # Logic and GarageBand only load AUs that pass Apple's own validator.
      - name: Validate AU with auval
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/plugin/Genisys_artefacts/Release/AU/Genisys.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -strict -v aumu Gnsy Kcag

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Genisys-${{ matrix.name }}
          path: |
            build/plugin/Genisys_artefacts/Release/VST3
            build/plugin/Genisys_artefacts/Release/AU
            build/plugin/Genisys_artefacts/Release/Standalone
          if-no-files-found: error
